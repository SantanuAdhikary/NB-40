<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         *{
            padding: 0;
            margin: 0;;
            box-sizing: border-box;
         }

         .outer{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
         }

         .inner{
            height: 400px;
            width: 500px;
            border: 3px solid black;

            position: relative;
         }

         .circle{
            height: 200px;
            width: 200px;
            border-radius: 50%;
            border: 4px solid green;
            position: absolute;
            left:50%;
            transform: translateX(-50%);
            top:-100px;
         }
    </style>
</head>
<body>
    <div class="outer">
         <div class="inner">

            <div class="circle"></div>
         </div>
    </div>
</body>
</html>
