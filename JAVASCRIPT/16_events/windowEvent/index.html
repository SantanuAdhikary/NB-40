<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>window events</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: serif;
        }

        .outer{
            height: 200vh;
            background:linear-gradient(to right , red,yellow);
            padding: 20px;
            position: relative;

        }

        .outer > h1{
            font-size: 60px;
            text-transform: capitalize;
            text-align: center;
            color: white;
            text-shadow: 3px 5px 2px black;
        }

        .outer > h2{
            position: absolute;
            top:20px;
            right:  20px;
            color:blue;
            font-size: 40px;
        }
    </style>
</head>
<body>
    
    <div class="outer">
          <h1> window events</h1>
    </div>

    <script src="./app.js"></script>
</body>
</html>
