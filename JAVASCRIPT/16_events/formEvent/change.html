<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>change event</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            position: relative;
            padding: 40px;
        }
        select{
            position: absolute;
            top : 40px ; 
            right : 40px;
            padding: 10px;
            font-weight: bold;
            font-size: 19px;
        }

        h1{
            text-align: center;
        }

        input{
            display: block;
            margin: 10px auto;
            padding: 10px;
            font-size: 18px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    
    <h1> change Event in form</h1>

    <select name="" id="">
        <option value="">change color</option>
        <option value="red">red</option>
        <option value="green">green</option>
        <option value="blue">blue</option>
        <option value="yellow">yellow</option>
    </select>

    <input type="text" placeholder="write something">

    <h2></h2>

    <script src="./change.js"></script>
</body>
</html>
