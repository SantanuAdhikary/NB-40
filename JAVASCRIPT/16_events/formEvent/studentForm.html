<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student form</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        main{
            height: 100vh;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap:25px;
        }

        main > h1{
            font-size: 50px;
            text-transform: capitalize;
            letter-spacing: 1.5px;
        }

        main > form{
            width: 400px;
            background-color: white;
            padding: 20px 40px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.8);
            border-radius: 20px;
        }

        form > label{
            display: block;
            font-weight: bold;
            font-size: 19px;
            margin-bottom: 10px;
        }
        form > input{
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 2px solid #ccc;
            font-size: 19px;
        }

        form > button{
            width: 100%;
            background-color: #444;
            padding: 10px;
            border-radius: 10px;
            color:white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 19px;
        }

        form > button:hover{
            background-color: #555;
        }

        input::placeholder{
            font-size: 18px;
        }

    </style>
    
</head>
<body>
    
    <main>
         <h1> student form</h1>
         <form action="">
            <label for="">name</label>
            <input type="text" placeholder="your name" id="stuName">

            <label for="">rollno</label>
            <input type="text" placeholder="your rollno" id="stuRoll">

            <label for="">phNo</label>
            <input type="text" placeholder="your phno" id="stuPh">

            <button>register</button>
         </form>
    </main>

    <script src="./studentForm.js"></script>
</body>
</html>
